# Python dev container — sysbox-runc + systemd + sshd.
# Setup walkthrough (Windows → WSL2 SSH, VS Code Remote-SSH, authorized_keys,
# the two accounts) lives in README.md next to this file.

name: agent-security

services:
  egress-proxy:
    image: ubuntu/squid:7.2-26.04_beta
    container_name: egress-proxy
    hostname: egress-proxy
    restart: unless-stopped
    volumes:
      - ./squid/squid.conf:/etc/squid/squid.conf:ro
      - ./squid/allowlist.txt:/etc/squid/allowlist.txt:ro
    networks: [jail, internet]

  # Publishes host SSH. `dev` is on an internal-only network and Docker won't
  # bind a host port for such a container, so the publish lives here: socat
  # splices 127.0.0.1:2223 → py-dev:22. This opens no egress path — socat only
  # ever dials py-dev:22.
  ssh-ingress:
    image: alpine/socat:latest
    container_name: ssh-ingress
    restart: unless-stopped
    command: -d -d TCP-LISTEN:2223,fork,reuseaddr TCP:py-dev:22
    ports:
      - "127.0.0.1:2223:2223"
    # Dual-homed. `priority` picks the default gateway (highest wins): route
    # out via `default` (has a gateway), keep `jail` just for the hop to
    # py-dev. Explicit so the pick is deterministic — jail is internal and has
    # no gateway to fall back on.
    networks:
      default:
        priority: 100
      jail:
        priority: 10
    depends_on: [dev]

    # Dual-homed boundary piece; socat needs no caps and writes nothing to disk.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  dev:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DEV_USER: ${DEV_USER:-dev}
        DEV_UID: ${DEV_UID:-1000}
        DEV_GID: ${DEV_GID:-1000}
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        NODE_MAJOR: ${NODE_MAJOR:-20}
    image: py-dev:latest
    container_name: py-dev
    hostname: py-dev
    runtime: sysbox-runc            # real systemd + sshd without --privileged
    restart: unless-stopped

    # No `ports:` here — this container is on the internal jail network, where
    # Docker ignores port publishing; inbound SSH arrives via ssh-ingress.

    volumes:
      # authorized_keys for both accounts (setup in README); :ro so the
      # container can't tamper with it.
      - ./authorized_keys:/home/dev/.ssh/authorized_keys:ro
      - ./authorized_keys:/home/agent/.ssh/authorized_keys:ro

      # Project tree. On WSL2 keep the host path on the Linux fs, not /mnt/c.
      - ..:/workspace

      # Persist homes + out-of-tree venvs across `docker compose down`.
      - dev-home:/home/dev
      - agent-home:/home/agent
      - dev-venvs:/opt/venvs

    # systemd-in-container stops on SIGRTMIN+3; without it `docker stop` waits
    # the full grace period then SIGKILLs.
    stop_signal: SIGRTMIN+3
    stop_grace_period: 30s

    depends_on: [egress-proxy]
    networks: [jail]

volumes:
  dev-home:
  dev-venvs:
  agent-home:

networks:
  jail:
    internal: true                  # no internet route — the egress enforcement
    ipam:
      config:
        - subnet: 172.30.0.0/24     # must match `acl jail` in squid.conf
  internet:
    driver: bridge
