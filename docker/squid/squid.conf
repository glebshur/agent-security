# ── egress allowlist proxy ──────────────────────────────────────────────
http_port 3128
visible_hostname egress-proxy

# Who may use the proxy: only the internal "jail" network.
acl jail src 172.30.0.0/24

# Safe ports / CONNECT handling.
acl SSL_ports port 443
acl Safe_ports port 80
acl Safe_ports port 443
acl CONNECT method CONNECT

# The allowlist. For HTTPS, Squid matches this against the CONNECT target
# host (no TLS interception); for HTTP, against the request host.
acl allowed dstdomain "/etc/squid/allowlist.txt"

# ── access rules (first match wins) ─────────────────────────────────────
http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow jail allowed
http_access deny all                 # anything not allowlisted → 403

# ── privacy / hygiene ───────────────────────────────────────────────────
forwarded_for delete
via off
httpd_suppress_version_string on

# ── no caching (avoids needing a cache_dir / `squid -z`) ─────────────────
cache deny all

# ── logs ────────────────────────────────────────────────────────────────
# NOT /dev/stdout: squid drops privileges to `cache_effective_user proxy`,
# Log to files the `proxy` user owns instead, and read them with:
#     docker exec egress-proxy tail -f /var/log/squid/access.log
access_log stdio:/var/log/squid/access.log
cache_log /var/log/squid/cache.log
logfile_rotate 0

# Faster shutdown on `docker compose down`.
shutdown_lifetime 5 seconds
