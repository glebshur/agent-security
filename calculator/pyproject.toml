[project]
name = "calculator"
version = "0.1.0"
description = "A simple console calculator supporting +, - and parentheses"
readme = "README.md"
authors = [
    { name = "glebshur", email = "glebshurov@gmail.com" }
]
requires-python = ">=3.10"
dependencies = []

[project.scripts]
calculator = "calculator:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
